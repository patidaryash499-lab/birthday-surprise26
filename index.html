<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Something Hidden…</title><style>:root{--bg:#09070d;--panel:#15101d;--pink:#ff8fb3;--lp:#ffd1de;--gold:#f6d58a;--white:#fff7fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#32182d 0,#100a14 38%,#09070d 75%);color:var(--white);font-family:Georgia,serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}.top{position:sticky;top:0;z-index:5;padding:10px 0 14px;background:linear-gradient(#09070df2,#09070d00)}.progress{height:5px;background:#2b2231;border-radius:99px;overflow:hidden}.bar{height:100%;width:3.33%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:.45s}.step{display:none;min-height:82vh;align-items:center;justify-content:center;animation:in .55s ease}.step.active{display:flex}@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.card{text-align:center;width:100%;padding:30px 18px;border:1px solid #ffffff12;border-radius:28px;background:linear-gradient(145deg,#17111fdd,#0d0a12ee);box-shadow:0 20px 70px #0008}.kicker{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:18px}.title{font-size:clamp(30px,8vw,58px);line-height:1.08;margin:0 0 18px;font-weight:500}.body{font-size:clamp(17px,4.5vw,22px);line-height:1.65;color:#f9eaf0;max-width:620px;margin:0 auto}.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}.btn,.choice{border:1px solid #ffffff1b;background:#ffffff08;color:var(--white);border-radius:16px;padding:13px 16px;font:inherit;cursor:pointer;transition:.2s}.btn:hover,.choice:hover{transform:translateY(-2px);border-color:#ff8fb366;background:#ff8fb312}.btn.primary{background:linear-gradient(135deg,#8e3153,#5d2138);border-color:#ff8fb355}.choice{min-width:145px}.choice b{display:block;color:var(--lp);font-size:16px}.choice span{display:block;color:#bcaebb;font:13px Arial;margin-top:5px}.question{font-size:24px;line-height:1.4;margin:20px 0}.ok{margin-top:15px;color:#ffbdd0;min-height:24px}.quote{margin:26px auto 0;padding:20px;border-left:2px solid var(--gold);background:#ffffff05;border-radius:0 16px 16px 0;text-align:left;font-style:italic;line-height:1.7;color:#ffeaf1}.songgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.song{padding:15px 10px}.song.selected{border-color:#f6d58a88;box-shadow:0 0 25px #f6d58a12}.note{margin-top:18px;color:var(--gold);font-size:13px}.final .title{font-size:clamp(44px,12vw,82px);color:#fff2f6;text-shadow:0 0 30px #ff8fb366}.heart{font-size:58px;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.15)}}.nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;z-index:20;background:#0c0910dd;border:1px solid #ffffff15;padding:8px;border-radius:18px;backdrop-filter:blur(10px)}.nav button{border:0;background:#ffffff0d;color:#fff;border-radius:12px;padding:10px 14px}@media(max-width:500px){.card{padding:28px 14px}.songgrid{grid-template-columns:1fr}.choice{width:100%}}</style></head><body><div class="wrap"><div class="top"><div class="progress"><div id="bar" class="bar"></div></div></div><main id="steps"></main></div><div class="nav"><button id="prev" onclick="go(-1)">‹</button><button id="next" class="btn primary" onclick="go(1)">Next ✨</button></div><audio id="player" preload="auto"></audio><script>const audio={"tum":"tum-se-hi.mp3","like":"i-like-me-better.mp3","iktara":"iktara.mp3","sajni":"sajni.mp3"};const steps=[[

{t:"Clue #5",h:"The secret gets closer",p:"A birthday is only one day. The memories around it can last much longer.",b:"Keep going"},
{t:"Mystery #4",q:"Which name deserves the biggest dramatic reveal?",choices:[["Hemi","Cute"],["Himi","Very cute"],["Chottu","Very suspicious"],["Golu Molu","The drama begins"]],answer:3},

]];let cur=0;const root=document.getElementById('steps');const bar=document.getElementById('bar');const player=document.getElementById('player');function picker(keys,names,i){return `<div class="songgrid">${keys.map((k,x)=>`<button class="choice song" id="song-${k}" onclick="pickSong('${k}',${i})"><b>${names[x]}</b><span>Play this mood</span></button>`).join('')}</div><div class="note">Tap a song. It will replace the previous one.</div>`}function render(){root.innerHTML='';steps.forEach((s,i)=>{let e=document.createElement('section');e.className='step'+(i===cur?' active':'');let x=`<div class="card ${s.final?'final':''}"><div class="kicker">Step ${i+1} / 30</div>${s.final?'<div class="heart">♥</div>':''}`;if(s.h)x+=`<h1 class="title">${s.h}</h1>`;if(s.p)x+=`<p class="body">${s.p}</p>`;if(s.quote)x+=`<div class="quote">${s.quote}</div>`;if(s.q){x+=`<div class="question">${s.q}</div><div class="btnrow">`;s.choices.forEach((c,j)=>x+=`<button class="choice" onclick="answer(${i},${j})"><b>${c[0]}</b><span>${c[1]}</span></button>`);x+=`</div><div id="ok${i}" class="ok"></div>`}if(s.songs)x+=picker(['tum','like'],['Tum Se Hi','I Like Me Better'],i);if(s.songs16)x+=picker(['iktara','sajni'],['Iktara','Sajni'],i);if(s.b)x+=`<div class="btnrow"><button class="btn primary" onclick="go(1)">${s.b}</button></div>`;x+='</div>';e.innerHTML=x;root.appendChild(e)}update()}function answer(i,j){let s=steps[i],o=document.getElementById('ok'+i);if(j===s.answer){o.textContent='✓ Correct. The next clue is unlocked.';setTimeout(()=>go(1),450)}else o.textContent='Not this one 😄 Try another option.'}function pickSong(k,i){player.src=audio[k];player.loop=true;player.play().catch(()=>{});document.querySelectorAll('.song').forEach(x=>x.classList.remove('selected'));document.getElementById('song-'+k).classList.add('selected');setTimeout(()=>go(1),500)}function go(d){let n=cur+d;if(n<0||n>=steps.length)return;cur=n;render();scrollTo({top:0,behavior:'smooth'});document.querySelector('.nav').style.display=cur===29?'none':'flex'}function update(){bar.style.width=((cur+1)/30*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').textContent='Next ✨'}render();</script></body></html>
